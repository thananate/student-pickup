<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Queue Monitor</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2, h3 { color: #1a73e8; margin-top: 0; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #e8f0fe; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid #1a73e8; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border-left: 5px solid #34a853; color: #555; }
    .now-calling { background: #e6f4ea; border-left-color: #34a853; font-weight: bold; }
    .year-tag { background: #1a73e8; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 5px; }
    button { width: 100%; background-color: #34a853; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 15px; }
    button:hover { background-color: #2d8e47; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>School Queue Monitor</h2>
    <button id="btnStart" onclick="startAudioSystem()">🔊 Click to Start Audio System</button>
    <p>Audio Status: <strong id="speakingStatus" style="color: #d93025;">System Inactive</strong></p>
    <hr>
    
    <h3>⏳ Queue List (<span id="queueCount">0</span>)</h3>
    <div id="queueList"></div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <h3 style="color: #34a853;">✅ Called History</h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDg0_AiLLITFAdqgN0AZk-l0vGc--HlAzU",
    authDomain: "ips-student-pickup-system.firebaseapp.com",
    databaseURL: "https://ips-student-pickup-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ips-student-pickup-system",
    storageBucket: "ips-student-pickup-system.firebasestorage.app",
    messagingSenderId: "732917618676",
    appId: "1:732917618676:web:9b37c6cb43casf15a6cba1",
    measurementId: "G-Y3KESCV89G"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const pickupRef = database.ref('pickup_queue');

  let queueData = [];
  let historyData = [];
  let isSpeaking = false;
  let isAudioActive = false;

  // โหลดรายการเสียงเตรียมไว้ในเบราว์เซอร์
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };

  function startAudioSystem() {
    isAudioActive = true;
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('speakingStatus').innerText = "Active (Waiting for queue...)";
    document.getElementById('speakingStatus').style.color = "#28a745";

    const testSpeech = new SpeechSynthesisUtterance('System activated');
    testSpeech.lang = 'en-US';
    window.speechSynthesis.speak(testSpeech);

    pickupRef.on('child_added', (snapshot) => {
      const student = { id: snapshot.key, ...snapshot.val() };
      
      if (!queueData.some(item => item.id === student.id)) {
        queueData.push(student);
        renderQueue();

        if (!isSpeaking) {
          processQueue();
        }
      }
    });
  }

  function renderQueue() {
    const queueListDiv = document.getElementById('queueList');
    document.getElementById('queueCount').innerText = queueData.length;
    queueListDiv.innerHTML = '';

    queueData.forEach((student, index) => {
      const div = document.createElement('div');
      div.className = `queue-item ${index === 0 && isSpeaking ? 'now-calling' : ''}`;
      const yearText = student.studentYear ? `<span class="year-tag">${student.studentYear}</span>` : '';
      div.innerHTML = `
        <div>
          <strong>${index + 1}. ${student.nickname}</strong> (${student.fullname}) ${yearText}
        </div>
        <small>${index === 0 && isSpeaking ? '🔊 Calling...' : 'Waiting'}</small>
      `;
      queueListDiv.appendChild(div);
    });
  }

  function renderHistory() {
    const historyListDiv = document.getElementById('historyList');
    historyListDiv.innerHTML = '';

    historyData.forEach((student) => {
      const timeStr = new Date(student.calledAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const div = document.createElement('div');
      div.className = 'history-item';
      const yearText = student.studentYear ? `<span class="year-tag" style="background: #34a853;">${student.studentYear}</span>` : '';
      div.innerHTML = `
        <div>
          <strong>${student.nickname}</strong> (${student.fullname}) ${yearText}
        </div>
        <small style="color: #28a745; font-weight: 500;">Called at ${timeStr}</small>
      `;
      historyListDiv.appendChild(div);
    });
  }

  function processQueue() {
    if (!isAudioActive || queueData.length === 0) {
      isSpeaking = false;
      document.getElementById('speakingStatus').innerText = "Active (Waiting for queue...)";
      document.getElementById('speakingStatus').style.color = "#28a745";
      renderQueue();
      return;
    }

    isSpeaking = true;
    const current = queueData[0];
    document.getElementById('speakingStatus').innerText = `Calling: ${current.nickname}`;
    document.getElementById('speakingStatus').style.color = "#d93025";
    renderQueue();

    speakEN(current.nickname, current.fullname, current.studentYear, () => {
      pickupRef.child(current.id).remove();
      
      const finishedStudent = queueData.shift();
      finishedStudent.calledAt = Date.now();
      historyData.unshift(finishedStudent);
      
      renderHistory();
      
      setTimeout(() => {
        processQueue();
      }, 2000);
    });
  }

  function speakEN(nickname, fullname, studentYear, callback) {
    const yearAnnouncement = studentYear ? `from ${studentYear}` : '';
    const text = `${nickname} ${fullname} ${yearAnnouncement}. Please come to the gate.`;
    
    window.speechSynthesis.cancel();

    // ดึงรายการเสียงและค้นหา "เสียงผู้หญิง" ภาษาอังกฤษ
    const voices = window.speechSynthesis.getVoices();
    const femaleVoice = voices.find(v => 
      v.lang.includes('en') && 
      (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Victoria'))
    ) || voices.find(v => v.lang.includes('en'));

    // --- รอบที่ 1 ---
    const speech1 = new SpeechSynthesisUtterance(text);
    speech1.lang = 'en-US';
    speech1.rate = 0.30;
    if (femaleVoice) speech1.voice = femaleVoice;

    speech1.onend = () => {
      // เว้นระยะ 1.5 วินาที แล้วประกาศซ้ำ --- รอบที่ 2 ---
      setTimeout(() => {
        const speech2 = new SpeechSynthesisUtterance(text);
        speech2.lang = 'en-US';
        speech2.rate = 0.30;
        if (femaleVoice) speech2.voice = femaleVoice;

        speech2.onend = () => {
          if (callback) callback();
        };

        speech2.onerror = () => {
          if (callback) callback();
        };

        window.speechSynthesis.speak(speech2);
      }, 1500);
    };

    speech1.onerror = () => {
      if (callback) callback();
    };

    window.speechSynthesis.speak(speech1);
  }
</script>
</body>
</html>
