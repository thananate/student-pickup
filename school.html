<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Pickup Display</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
      padding-bottom: 85px; /* เว้นพื้นที่ด้านล่างไม่ให้ทับแถบตัวอักษรวิ่ง */
      text-align: center;
    }
    h1 { color: #38bdf8; font-size: 36px; margin-bottom: 10px; }
    #startAudioBtn {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    #startAudioBtn:hover { background-color: #16a34a; }
    
    .current-call {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto 30px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .call-label { font-size: 20px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }
    .student-nickname { font-size: 64px; font-weight: 800; color: #facc15; margin: 10px 0; }
    .student-fullname { font-size: 28px; color: #e2e8f0; margin-bottom: 10px; }
    .student-year {
      display: inline-block;
      background-color: #0284c7;
      color: white;
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 24px;
      font-weight: bold;
    }

    .queue-section { max-width: 800px; margin: 0 auto; text-align: left; }
    .queue-title { font-size: 20px; color: #94a3b8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .queue-item {
      background-color: #1e293b;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
    }

    /* แถบตัวอักษรวิ่งด้านล่างจอ (Called History Ticker) */
    .ticker-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background-color: #0284c7;
      border-top: 3px solid #38bdf8;
      display: none; /* ซ่อนไว้ก่อนจนกว่าจะมีคนถูกเรียกผ่านไป */
      align-items: center;
      overflow: hidden;
      z-index: 999;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
    }
    .ticker-label {
      background-color: #facc15;
      color: #0f172a;
      font-weight: 800;
      font-size: 18px;
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 2;
      box-shadow: 4px 0 10px rgba(0,0,0,0.25);
    }
    .ticker-move-area {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }
    .ticker-content {
      display: inline-block;
      padding-left: 100%;
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      animation: tickerScroll 25s linear infinite;
    }
    .ticker-item {
      margin-right: 45px;
    }
    .ticker-time {
      color: #fde047;
      font-size: 18px;
      margin-left: 6px;
    }

    @keyframes tickerScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <h1>STUDENT PICKUP QUEUE</h1>
  <button id="startAudioBtn" onclick="enableAudio()">🔊 Click to Enable Voice Announcement</button>

  <div class="current-call">
    <div class="call-label">Now Calling</div>
    <div id="currentNickname" class="student-nickname">-</div>
    <div id="currentFullname" class="student-fullname">Waiting for pickup requests...</div>
    <div id="currentYear" class="student-year" style="display: none;"></div>
  </div>

  <div class="queue-section">
    <div class="queue-title">Upcoming Queue (<span id="queueCount">0</span>)</div>
    <div id="queueList"></div>
  </div>

  <!-- แถบตัวอักษรวิ่งแสดงรายชื่อที่เรียกผ่านไปแล้ว -->
  <div id="tickerWrap" class="ticker-wrap">
    <div class="ticker-label">RECENTLY CALLED</div>
    <div class="ticker-move-area">
      <div id="tickerContent" class="ticker-content"></div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDg0_AiLLITFAdqgN0AZk-l0vGc--HlAzU",
    authDomain: "ips-student-pickup-system.firebaseapp.com",
    databaseURL: "https://ips-student-pickup-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ips-student-pickup-system",
    storageBucket: "ips-student-pickup-system.firebasestorage.app",
    messagingSenderId: "732917618676",
    appId: "1:732917618676:web:9b37c6cb43casf15a6cba1",
    measurementId: "G-Y3KESCV89G"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const pickupRef = database.ref('pickup_queue');

  let audioEnabled = false;
  let isSpeaking = false;
  let queueItems = [];
  let calledHistory = []; // เก็บประวัติรายชื่อที่เรียกผ่านไปแล้ว
  const MAX_HISTORY_ITEMS = 15; // แสดงย้อนหลังสูงสุด 15 คนล่าสุด

  function enableAudio() {
    audioEnabled = true;
    const btn = document.getElementById('startAudioBtn');
    btn.innerText = "✅ Voice Announcement Active";
    btn.style.backgroundColor = "#0284c7";
    
    const testUtterance = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(testUtterance);
    processNextInQueue();
  }

  pickupRef.on('value', (snapshot) => {
    const data = snapshot.val();
    queueItems = [];
    if (data) {
      Object.keys(data).forEach(key => {
        queueItems.push({ id: key, ...data[key] });
      });
      queueItems.sort((a, b) => a.timestamp - b.timestamp);
    }
    renderQueue();
    processNextInQueue();
  });

  function renderQueue() {
    const queueListDiv = document.getElementById('queueList');
    const queueCountSpan = document.getElementById('queueCount');
    
    const upcoming = isSpeaking ? queueItems.slice(1) : queueItems;
    queueCountSpan.innerText = upcoming.length;
    queueListDiv.innerHTML = '';

    upcoming.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'queue-item';
      div.innerHTML = `
        <span><strong>#${index + 1}</strong> ${item.nickname} (${item.fullname})</span>
        <span style="background: #334155; padding: 4px 12px; border-radius: 15px; font-size: 16px;">${item.studentYear}</span>
      `;
      queueListDiv.appendChild(div);
    });
  }

  // เพิ่มรายชื่อที่เรียกเสร็จแล้วลงในแถบตัวอักษรวิ่งด้านล่าง
  function addToCalledTicker(student) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    calledHistory.unshift({
      nickname: student.nickname,
      fullname: student.fullname,
      studentYear: student.studentYear,
      time: timeStr
    });

    if (calledHistory.length > MAX_HISTORY_ITEMS) {
      calledHistory.pop();
    }

    renderTicker();
  }

  function renderTicker() {
    const tickerWrap = document.getElementById('tickerWrap');
    const tickerContent = document.getElementById('tickerContent');

    if (calledHistory.length === 0) {
      tickerWrap.style.display = 'none';
      return;
    }

    tickerWrap.style.display = 'flex';
    tickerContent.innerHTML = calledHistory.map(item => 
      `<span class="ticker-item">• <strong>${item.nickname}</strong> (${item.fullname} - ${item.studentYear}) <span class="ticker-time">[${item.time}]</span></span>`
    ).join('');

    // ปรับความเร็วในการวิ่งอัตโนมัติตามจำนวนรายชื่อ (ยิ่งหลายคนยิ่งให้เวลาวิ่งนานขึ้น จะได้อ่านทัน)
    const duration = Math.max(18, calledHistory.length * 6);
    tickerContent.style.animationDuration = `${duration}s`;
  }

  function speakText(text, rate = 0.85) {
    return new Promise((resolve) => {
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const ukFemale = voices.find(v => v.lang === 'en-GB' && v.name.includes('Female')) 
                    || voices.find(v => v.lang === 'en-GB');
      if (ukFemale) utterance.voice = ukFemale;
      
      utterance.lang = 'en-GB';
      utterance.rate = rate;
      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();
      window.speechSynthesis.speak(utterance);
    });
  }

  function pause(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function processNextInQueue() {
    if (!audioEnabled || isSpeaking || queueItems.length === 0) return;

    isSpeaking = true;
    const current = queueItems[0];
    renderQueue();

    document.getElementById('currentNickname').innerText = current.nickname;
    document.getElementById('currentFullname').innerText = current.fullname;
    const yearEl = document.getElementById('currentYear');
    yearEl.innerText = current.studentYear;
    yearEl.style.display = 'inline-block';

    // ประกาศเสียงพร้อมเว้นจังหวะ
    await speakText(current.nickname, 0.85);
    await pause(500);
    await speakText(current.fullname, 0.85);
    await pause(400);
    await speakText(current.studentYear, 0.85);
    await pause(1200);

    // ประกาศซ้ำรอบที่ 2
    await speakText(`${current.nickname}, ${current.studentYear}`, 0.85);
    await pause(1500);

    // นำชื่อที่เพิ่งเรียกเสร็จไปต่อท้ายในแถบตัวอักษรวิ่งด้านล่างจอ
    addToCalledTicker(current);

    // ลบออกจากคิวหลักใน Firebase
    await pickupRef.child(current.id).remove();

    isSpeaking = false;

    if (queueItems.length <= 1) {
      document.getElementById('currentNickname').innerText = '-';
      document.getElementById('currentFullname').innerText = 'Waiting for pickup requests...';
      yearEl.style.display = 'none';
    } else {
      processNextInQueue();
    }
  }
</script>
</body>
</html>
