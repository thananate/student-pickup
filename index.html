<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Pickup Request</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a73e8; margin-top: 0; text-align: center; }
    h3 { color: #333; margin-top: 0; font-size: 18px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: 600; display: block; margin-bottom: 5px; color: #444; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: white; }
    input:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); }
    button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #a0c3ff; cursor: not-allowed; }
    .link-btn { background: none; color: #1a73e8; font-size: 14px; font-weight: 600; text-decoration: underline; padding: 8px; margin-top: 10px; }
    .link-btn:hover { background: none; color: #0d47a1; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; gap: 6px; }
    .small-btn { width: auto; background-color: #f1f3f4; color: #555; padding: 6px 10px; font-size: 12px; margin: 0; }
    .small-btn:hover { background-color: #e2e6ea; }
    .student-card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; margin-bottom: 12px; background: #fafafa; display: flex; justify-content: space-between; align-items: center; }
    .student-info { text-align: left; }
    .student-name { font-weight: 700; font-size: 16px; color: #222; }
    .year-badge { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 4px; }
    .pickup-btn { width: auto; padding: 10px 18px; font-size: 14px; margin: 0; background-color: #28a745; }
    .pickup-btn:hover { background-color: #218838; }
    .pickup-btn:disabled { background-color: #94d3a2; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Student Pickup System</h2>
    <p id="loadingMsg" style="text-align: center; color: #1a73e8; font-size: 14px;">Loading database...</p>

    <!-- ส่วนที่ 1: หน้าจอ Login -->
    <div id="loginSection" style="display: none;">
      <div class="input-group">
        <label>Parent Phone Number:</label>
        <input type="tel" id="phoneInput" placeholder="e.g. 0892055927" autocomplete="tel">
      </div>
      <div class="input-group">
        <label>Password:</label>
        <input type="password" id="passwordInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter') handleLogin()">
      </div>
      <button onclick="handleLogin()">Login</button>
      <button type="button" class="link-btn" onclick="showResetSection()">Forgot / Reset Password?</button>
      <p id="loginError" style="color: #d93025; font-size: 14px; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- ส่วนที่ 2: หน้าจอ Reset Password -->
    <div id="resetSection" style="display: none;">
      <h3>Reset Password</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Verify your phone number and your child's Year group to set a new password.</p>
      
      <div class="input-group">
        <label>Registered Phone Number:</label>
        <input type="tel" id="resetPhoneInput" placeholder="e.g. 0892055927">
      </div>
      <div class="input-group">
        <label>Verify Child's Year (e.g. 13, 12, 11):</label>
        <input type="text" id="resetYearInput" placeholder="Enter Year number (e.g. 13)">
      </div>
      <div class="input-group">
        <label>New Password (at least 4 characters):</label>
        <input type="password" id="newPasswordInput" placeholder="Enter new password">
      </div>
      <div class="input-group">
        <label>Confirm New Password:</label>
        <input type="password" id="confirmPasswordInput" placeholder="Re-enter new password">
      </div>

      <button onclick="handleResetPassword()">Save New Password</button>
      <button type="button" class="link-btn" onclick="backToLogin()">Back to Login</button>
      <p id="resetMsg" style="font-size: 14px; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- ส่วนที่ 3: หน้าจอรายชื่อลูกหลัง Login สำเร็จ -->
    <div id="dashboardSection" style="display: none;">
      <div class="header-bar">
        <span id="welcomePhone" style="font-size: 13px; color: #555; font-weight: 600;"></span>
        <div>
          <button class="small-btn" onclick="showResetFromDashboard()">Change Password</button>
          <button class="small-btn" onclick="handleLogout()">Logout</button>
        </div>
      </div>
      
      <p style="font-size: 14px; color: #666; margin-bottom: 12px;">Select your child to request pickup:</p>
      <div id="myChildrenList"></div>
      
      <p id="statusMsg" style="color: #28a745; font-weight: 600; font-size: 15px; margin-top: 15px; text-align: center;"></p>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDg0_AiLLITFAdqgN0AZk-l0vGc--HlAzU",
    authDomain: "ips-student-pickup-system.firebaseapp.com",
    databaseURL: "https://ips-student-pickup-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ips-student-pickup-system",
    storageBucket: "ips-student-pickup-system.firebasestorage.app",
    messagingSenderId: "732917618676",
    appId: "1:732917618676:web:9b37c6cb43casf15a6cba1",
    measurementId: "G-Y3KESCV89G"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const pickupRef = database.ref('pickup_queue');
  const customPassRef = database.ref('parent_passwords');

  const SHEET_ID = "1LXna7EyJxCEjpFdfTFdw9uFuheXM_2_opPUX_QaigdY";

  const COOLDOWN_TIME = 10 * 60 * 1000;
  const SCHOOL_LAT = 13.7221873;
  const SCHOOL_LNG = 100.5012773;
  const MAX_DISTANCE_KM = 0.5;

  let ALL_RECORDS = [];
  let CUSTOM_PASSWORDS = {}; // เก็บรหัสผ่านใหม่ที่ผู้ปกครองอัปเดตใน Firebase

  function normalizePhone(phone) {
    return String(phone || '').replace(/[^0-9]/g, '');
  }

  // โหลดรหัสผ่านที่ผู้ปกครองเปลี่ยนเองจาก Firebase
  customPassRef.on('value', (snapshot) => {
    CUSTOM_PASSWORDS = snapshot.val() || {};
  });

  window.handleSheetData = function(json) {
    const loadingMsg = document.getElementById('loadingMsg');

    try {
      const rows = json.table.rows;
      ALL_RECORDS = [];

      rows.forEach(row => {
        if (row.c && row.c[0] && row.c[1] && row.c[2]) {
          const name = String(row.c[0].v || '').trim();
          const rawYear = String(row.c[1].v || '').trim();
          const phone = normalizePhone(row.c[2].v);
          const defaultPassword = (row.c[3] && row.c[3].v !== null) ? String(row.c[3].v).trim() : '';

          if (name && rawYear && phone && name.toLowerCase() !== 'student full name') {
            const yearNum = rawYear.replace(/[^0-9]/g, '');
            const year = rawYear.toLowerCase().startsWith('year') ? rawYear : `Year ${rawYear}`;
            ALL_RECORDS.push({ name, year, yearNum, phone, defaultPassword });
          }
        }
      });

      // รอให้ Firebase โหลดรหัสผ่านที่อัปเดตเสร็จก่อนเช็ก Session
      customPassRef.once('value', (snap) => {
        CUSTOM_PASSWORDS = snap.val() || {};
        loadingMsg.style.display = 'none';
        checkSavedSession();
      });
    } catch (error) {
      loadingMsg.style.color = '#d93025';
      loadingMsg.innerText = 'Error loading database.';
    }
  };

  function loadStudentsViaJSONP() {
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetData`;
    script.onerror = function() {
      const loadingMsg = document.getElementById('loadingMsg');
      loadingMsg.style.color = '#d93025';
      loadingMsg.innerText = 'Cannot connect to Google Sheets.';
    };
    document.body.appendChild(script);
  }

  loadStudentsViaJSONP();

  // ตรวจสอบรหัสผ่านที่ใช้งานจริงของเบอร์นั้น (เช็ก Firebase ก่อน ถ้าไม่มีค่อยใช้รหัสใน Google Sheets)
  function getActivePassword(phone, defaultSheetPass) {
    if (CUSTOM_PASSWORDS[phone] && CUSTOM_PASSWORDS[phone].password) {
      return CUSTOM_PASSWORDS[phone].password;
    }
    return defaultSheetPass;
  }

  function checkSavedSession() {
    const savedPhone = localStorage.getItem('pickup_auth_phone');
    const savedPass = localStorage.getItem('pickup_auth_pass');

    if (savedPhone && savedPass) {
      const matchedChildren = findChildren(savedPhone, savedPass);
      if (matchedChildren.length > 0) {
        showDashboard(savedPhone, matchedChildren);
        return;
      }
    }
    document.getElementById('loginSection').style.display = 'block';
  }

  function findChildren(phone, password) {
    const cleanPhone = normalizePhone(phone);
    const uniqueChildren = new Map();

    ALL_RECORDS.forEach(record => {
      if (record.phone === cleanPhone) {
        const activePass = getActivePassword(cleanPhone, record.defaultPassword);
        if (activePass && activePass === password) {
          uniqueChildren.set(record.name.toLowerCase(), { name: record.name, year: record.year });
        }
      }
    });

    return Array.from(uniqueChildren.values());
  }

  function handleLogin() {
    const phone = document.getElementById('phoneInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const errorMsg = document.getElementById('loginError');

    if (!phone || !password) {
      errorMsg.innerText = 'Please enter both phone number and password.';
      return;
    }

    const matchedChildren = findChildren(phone, password);

    if (matchedChildren.length === 0) {
      errorMsg.innerText = 'Invalid phone number or password.';
      return;
    }

    localStorage.setItem('pickup_auth_phone', normalizePhone(phone));
    localStorage.setItem('pickup_auth_pass', password);
    errorMsg.innerText = '';

    showDashboard(normalizePhone(phone), matchedChildren);
  }

  // เปิดหน้า Reset Password
  function showResetSection() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('resetSection').style.display = 'block';
    document.getElementById('resetMsg').innerText = '';
    document.getElementById('resetPhoneInput').value = document.getElementById('phoneInput').value;
  }

  function showResetFromDashboard() {
    const savedPhone = localStorage.getItem('pickup_auth_phone') || '';
    showResetSection();
    document.getElementById('resetPhoneInput').value = savedPhone;
  }

  function backToLogin() {
    document.getElementById('resetSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('loginError').innerText = '';
  }

  // ประมวลผลการตั้งรหัสผ่านใหม่
  function handleResetPassword() {
    const phone = normalizePhone(document.getElementById('resetPhoneInput').value);
    const verifyYear = document.getElementById('resetYearInput').value.replace(/[^0-9]/g, '');
    const newPass = document.getElementById('newPasswordInput').value.trim();
    const confirmPass = document.getElementById('confirmPasswordInput').value.trim();
    const resetMsg = document.getElementById('resetMsg');

    if (!phone || !verifyYear || !newPass || !confirmPass) {
      resetMsg.style.color = '#d93025';
      resetMsg.innerText = 'Please fill in all fields.';
      return;
    }

    if (newPass.length < 4) {
      resetMsg.style.color = '#d93025';
      resetMsg.innerText = 'New password must be at least 4 characters.';
      return;
    }

    if (newPass !== confirmPass) {
      resetMsg.style.color = '#d93025';
      resetMsg.innerText = 'Passwords do not match.';
      return;
    }

    // ตรวจสอบว่าเบอร์โทร + ปีการศึกษาของลูก ตรงกับใน Google Sheets หรือไม่
    const isVerified = ALL_RECORDS.some(r => r.phone === phone && r.yearNum === verifyYear);

    if (!isVerified) {
      resetMsg.style.color = '#d93025';
      resetMsg.innerText = 'Phone number or child\'s Year does not match our records.';
      return;
    }

    // บันทึกรหัสผ่านใหม่ลง Firebase
    customPassRef.child(phone).set({
      password: newPass,
      updatedAt: Date.now()
    }).then(() => {
      resetMsg.style.color = '#28a745';
      resetMsg.innerText = 'Password updated successfully! Redirecting to login...';
      
      // ล้างค่าช่องกรอกและอัปเดต Session
      document.getElementById('newPasswordInput').value = '';
      document.getElementById('confirmPasswordInput').value = '';
      document.getElementById('phoneInput').value = phone;
      document.getElementById('passwordInput').value = '';
      localStorage.removeItem('pickup_auth_pass');

      setTimeout(() => {
        backToLogin();
      }, 1500);
    }).catch(() => {
      resetMsg.style.color = '#d93025';
      resetMsg.innerText = 'Failed to save new password. Please try again.';
    });
  }

  function handleLogout() {
    localStorage.removeItem('pickup_auth_phone');
    localStorage.removeItem('pickup_auth_pass');
    document.getElementById('phoneInput').value = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('statusMsg').innerText = '';
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  }

  function showDashboard(phone, children) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('resetSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    document.getElementById('welcomePhone').innerText = `Parent: ${phone}`;

    const listDiv = document.getElementById('myChildrenList');
    listDiv.innerHTML = '';

    children.forEach((child, index) => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.innerHTML = `
        <div class="student-info">
          <div class="student-name">${child.name}</div>
          <span class="year-badge">${child.year}</span>
        </div>
        <button class="pickup-btn" id="btn_${index}" onclick="requestPickup('${child.name.replace(/'/g, "\\'")}', '${child.year}', 'btn_${index}')">
          Call Pickup
        </button>
      `;
      listDiv.appendChild(card);
    });
  }

  function getDistanceInKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * (Math.PI / 180);
    const dLon = (lon2 - lon1) * (Math.PI / 180);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2); 
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function requestPickup(studentName, studentYear, btnId) {
    const btn = document.getElementById(btnId);
    const statusMsg = document.getElementById('statusMsg');
    const studentKey = `cooldown_${studentName.toLowerCase()}`;
    const lastCalled = localStorage.getItem(studentKey);
    const now = Date.now();

    if (lastCalled && (now - parseInt(lastCalled)) < COOLDOWN_TIME) {
      const remainingMinutes = Math.ceil((COOLDOWN_TIME - (now - parseInt(lastCalled))) / 60000);
      alert(`${studentName} was recently requested. Please wait ${remainingMinutes} minute(s).`);
      return;
    }

    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      return;
    }

    btn.disabled = true;
    statusMsg.style.color = "#1a73e8";
    statusMsg.innerText = "Checking location...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const distance = getDistanceInKm(position.coords.latitude, position.coords.longitude, SCHOOL_LAT, SCHOOL_LNG);

        if (distance > MAX_DISTANCE_KM) {
          btn.disabled = false;
          statusMsg.innerText = "";
          alert(`You are too far from the school (${distance.toFixed(2)} km away). You must be within ${MAX_DISTANCE_KM * 1000} meters.`);
          return;
        }

        const nicknameMatch = studentName.match(/\(([^)]+)\)/);
        const nickname = nicknameMatch ? nicknameMatch[1] : studentName.split(' ')[0];
        const cleanFullname = studentName.replace(/\([^)]+\)\s*/g, '');

        pickupRef.push({
          nickname: nickname,
          fullname: cleanFullname,
          studentYear: studentYear,
          timestamp: now
        });

        localStorage.setItem(studentKey, now.toString());
        statusMsg.style.color = "#28a745";
        statusMsg.innerText = `Request sent for ${studentName} (${studentYear})!`;
      },
      () => {
        btn.disabled = false;
        statusMsg.innerText = "";
        alert("Unable to retrieve your location. Please allow location access.");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }
</script>
</body>
</html>
