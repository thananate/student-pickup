<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Pickup & Queue System</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2, h3 { color: #1a73e8; margin-top: 0; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: 600; display: block; margin-bottom: 5px; color: #444; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #e8f0fe; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid #1a73e8; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border-left: 5px solid #34a853; color: #555; }
    .now-calling { background: #e6f4ea; border-left-color: #34a853; font-weight: bold; }
    .mode-switch { text-align: right; margin-bottom: 10px; }
    .mode-switch button { width: auto; padding: 6px 12px; font-size: 12px; background: #5f6368; }
    .btn-start { background-color: #34a853; margin-bottom: 15px; }
    .btn-start:hover { background-color: #2d8e47; }
  </style>
</head>
<body>

<div class="container">
  <div class="mode-switch">
    <button onclick="toggleView()">สลับโหมด (ผู้ปกครอง / โรงเรียน)</button>
  </div>

  <!-- 1. หน้าสำหรับผู้ปกครอง (Parent View) -->
  <div class="card" id="parentView">
    <h2>Student Pickup Request</h2>
    
    <div class="input-group">
      <label>Student's Nickname (ชื่อเล่น):</label>
      <input type="text" id="nickname" placeholder="e.g. Alex">
    </div>
    <div class="input-group">
      <label>Student's Full Name (ชื่อจริง):</label>
      <input type="text" id="fullname" placeholder="e.g. Alex Smith">
    </div>
    <button id="btnRequest" onclick="sendPickupRequest()">Request Call (กดเรียก)</button>
    <p id="statusMsg" style="color: #666; font-size: 14px; margin-top: 15px;"></p>
  </div>

  <!-- 2. หน้าสำหรับโรงเรียน / ประกาศเสียง (Announcer & Queue View) -->
  <div class="card" id="schoolView" style="display: none;">
    <h2>School Queue Monitor</h2>
    <button id="btnStartAudio" class="btn-start" onclick="activateSchoolAudio()">🔊 กดเพื่อเปิดระบบเสียงและเริ่มรับคิว</button>
    <p>สถานะประกาศเสียง: <strong id="speakingStatus" style="color: #d93025;">รอเปิดระบบเสียง...</strong></p>
    <hr>
    
    <h3>⏳ รายการคิวที่รอประกาศ (<span id="queueCount">0</span>)</h3>
    <div id="queueList"></div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <h3 style="color: #34a853;">✅ รายการที่ประกาศแล้ว (Called History)</h3>
    <div id="historyList"></div>
  </div>
</div>
