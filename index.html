<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Pickup & Queue System</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2, h3 { color: #1a73e8; margin-top: 0; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: 600; display: block; margin-bottom: 5px; color: #444; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #e8f0fe; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid #1a73e8; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border-left: 5px solid #34a853; color: #555; }
    .now-calling { background: #e6f4ea; border-left-color: #34a853; font-weight: bold; }
    .mode-switch { text-align: right; margin-bottom: 10px; }
    .mode-switch button { width: auto; padding: 6px 12px; font-size: 12px; background: #5f6368; }
    .time-badge { background: #fff3cd; color: #856404; padding: 8px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <div class="mode-switch">
    <button onclick="toggleView()">สลับโหมด (ผู้ปกครอง / โรงเรียน)</button>
  </div>

  <!-- 1. หน้าสำหรับผู้ปกครอง (Parent View) -->

    <div id="timeStatusBadge" class="time-badge">🕒 กำลังตรวจสอบเวลาให้บริการ...</div>
