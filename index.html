<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Pickup Request</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a73e8; margin-top: 0; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: 600; display: block; margin-bottom: 5px; color: #444; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: white; }
    button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #1557b0; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Student Pickup Request</h2>
    
    <div class="input-group">
      <label>Nickname:</label>
      <input type="text" id="nickname" placeholder="e.g. Alex">
    </div>

    <div class="input-group">
      <label>Full Name:</label>
      <input type="text" id="fullname" placeholder="e.g. Alex Smith">
    </div>

    <div class="input-group">
      <label>Year Group:</label>
      <select id="studentYear">
        <option value="">-- Select Year --</option>
        <option value="K1">Year 1</option>
        <option value="K2">Year 1</option>
        <option value="Year 1">Year 1</option>
        <option value="Year 2">Year 2</option>
        <option value="Year 3">Year 3</option>
        <option value="Year 4">Year 4</option>
        <option value="Year 5">Year 5</option>
        <option value="Year 6">Year 6</option>
        <option value="Year 7">Year 7</option>
        <option value="Year 8">Year 8</option>
        <option value="Year 9">Year 9</option>
        <option value="Year 10">Year 10</option>
        <option value="Year 11">Year 11</option>
        <option value="Year 12">Year 12</option>
        <option value="Year 13">Year 13</option>
      </select>
    </div>

    <button id="btnRequest" onclick="sendPickupRequest()">Submit Request</button>
    <p id="statusMsg" style="color: #28a745; font-weight: 600; font-size: 15px; margin-top: 15px; text-align: center;"></p>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDg0_AiLLITFAdqgN0AZk-l0vGc--HlAzU",
    authDomain: "ips-student-pickup-system.firebaseapp.com",
    databaseURL: "https://ips-student-pickup-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ips-student-pickup-system",
    storageBucket: "ips-student-pickup-system.firebasestorage.app",
    messagingSenderId: "732917618676",
    appId: "1:732917618676:web:9b37c6cb43casf15a6cba1",
    measurementId: "G-Y3KESCV89G"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const pickupRef = database.ref('pickup_queue');

  const COOLDOWN_TIME = 10 * 60 * 1000;

  function sendPickupRequest() {
    const nickname = document.getElementById('nickname').value.trim();
    const fullname = document.getElementById('fullname').value.trim();
    const studentYear = document.getElementById('studentYear').value;
    const statusMsg = document.getElementById('statusMsg');

    if (!nickname || !fullname || !studentYear) {
      alert("Please fill in Nickname, Full Name, and select Year Group.");
      return;
    }

    const studentKey = `cooldown_${nickname.toLowerCase()}_${fullname.toLowerCase()}`;
    const lastCalled = localStorage.getItem(studentKey);
    const now = Date.now();

    if (lastCalled && (now - parseInt(lastCalled)) < COOLDOWN_TIME) {
      const remainingMinutes = Math.ceil((COOLDOWN_TIME - (now - parseInt(lastCalled))) / 60000);
      alert(`This student was recently requested. Please wait ${remainingMinutes} minute(s) before trying again.`);
      return;
    }

    pickupRef.push({
      nickname: nickname,
      fullname: fullname,
      studentYear: studentYear,
      timestamp: now
    });

    localStorage.setItem(studentKey, now.toString());
    statusMsg.innerText = `Request sent for ${nickname} (${studentYear})! Please wait.`;
    document.getElementById('nickname').value = '';
    document.getElementById('fullname').value = '';
    document.getElementById('studentYear').value = '';
  }
</script>
</body>
</html>
